<div class="login-container">
    <div class="login-card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to your account</p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" formControlName="email" placeholder="Enter your email" />

                <small *ngIf="loginForm.get('email')?.touched &&
                      loginForm.get('email')?.invalid">
                    Please enter a valid email address.
                </small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" formControlName="password" placeholder="Enter your password" />

                <small *ngIf="loginForm.get('password')?.touched &&
                      loginForm.get('password')?.invalid">
                    Password is required.
                </small>
            </div>

            <p class="error-message" *ngIf="errorMessage">
                {{ errorMessage }}
            </p>

            <p class="success-message" *ngIf="successMessage">
                {{ successMessage }}
            </p>

            <button type="submit" [disabled]="loading">
                {{ loading ? 'Signing in...' : 'Login' }}
            </button>

        </form>
    </div>
</div>
