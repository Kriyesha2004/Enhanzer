<div class="login-container">
    <div class="login-card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to your account</p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" formControlName="email" placeholder="Enter your email" />

                <small *ngIf="loginForm.get('email')?.touched &&
                      loginForm.get('email')?.invalid">
                    Please enter a valid email address.
                </small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" formControlName="password" placeholder="Enter your password" />

                <small *ngIf="loginForm.get('password')?.touched &&
                      loginForm.get('password')?.invalid">
                    Password is required.
                </small>
            </div>

            <p class="error-message" *ngIf="errorMessage">
                {{ errorMessage }}
            </p>

            <p class="success-message" *ngIf="successMessage">
                {{ successMessage }}
            </p>

            <button type="submit" [disabled]="loading">
                {{ loading ? 'Signing in...' : 'Login' }}
            </button>

            <!-- Quick link to Dashboard and Purchase Bill -->
            <div class="quick-access">
                <div class="divider">
                    <span>QUICK ACCESS</span>
                </div>
                <div class="quick-buttons">
                    <button type="button" class="btn-dashboard-nav" (click)="goToDashboard()">
                        📊 Go to eZuite Dashboard &rarr;
                    </button>
                    <button type="button" class="btn-purchase-bill" (click)="goToPurchaseBill()">
                        🛒 Go to Purchase Bill Page &rarr;
                    </button>
                </div>
                <div class="demo-hint">
                    <small>Default credentials: <code>info&#64;enhanzer.com</code> / <code>Welcome#5</code></small>
                    <button type="button" class="btn-demo-fill" (click)="fillDemoCredentials()">Auto-fill</button>
                </div>
            </div>

        </form>
    </div>
</div>
